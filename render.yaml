services:
  - type: web
    name: kickboxing-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: kickboxing-data
      mountPath: /var/data
      sizeGB: 1
